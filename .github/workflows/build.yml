name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          A63065: ${{ secrets.A63065 }}
          B997F8: ${{ secrets.B997F8 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('A63065', '')
          tag_b = os.environ.get('B997F8', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- 5cc4f1766ecf78385e46e05e9192613e4f85fcb9 -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- 08171c9dca38d829e6a747de04aff8ac41396ead89479c -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
